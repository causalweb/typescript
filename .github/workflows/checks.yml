name: TypeScript checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: causalweb/spec
          ref: a012c85a5af5b7d5506a1c9a83f94815a124b1ea
          path: .spec
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: causalweb/conformance
          ref: e3167cd97fbed234352e004a62977922a5ec81ae
          path: .conformance
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix .conformance --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: node scripts/check-spec.mjs .spec
      - run: node .conformance/runner.mjs --spec .spec -- node scripts/conformance-adapter.mjs
      - run: node .conformance/runner.mjs --spec .spec --profile prefix-evaluation-v1 -- node scripts/conformance-adapter.mjs
      - run: npm audit --audit-level=high
      - run: npm run test:package
      - run: npm run changeset:status
      - run: npm run release:check
      - if: github.event_name == 'pull_request'
        run: npm run release:check
        env:
          CAUSALWEB_CHANGESET_BASE: ${{ github.event.pull_request.base.sha }}
      - run: npm run test:release
  peer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: causalweb/rust
          ref: d028de2245d41a4af636a211b6a224bd561bceaf
          path: .rust
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: rustup override set 1.95.0
      - run: node scripts/interop.mjs .rust
